<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Apply: Junior Software Engineer · lazyBoi playground</title>
    <link rel="stylesheet" href="playground.css" />
  </head>
  <body>
    <main>
      <h1>Apply: Junior Software Engineer</h1>
      <p class="lead">A Greenhouse / Lever-style application.</p>
      <form id="apply">
        <section class="card">
          <h2>Personal information</h2>
          <div class="row2">
            <div class="f"><label for="j-first">First Name *</label><input id="j-first" name="job_application[first_name]" required /></div>
            <div class="f"><label for="j-last">Last Name *</label><input id="j-last" name="job_application[last_name]" required /></div>
          </div>
          <div class="f"><label for="j-email">Email *</label><input id="j-email" name="job_application[email]" type="email" required /></div>
          <div class="f"><label for="j-phone">Phone</label><input id="j-phone" name="job_application[phone]" type="tel" /></div>
          <div class="f"><label for="j-resume">Resume/CV *</label><input id="j-resume" name="job_application[resume]" type="file" accept=".pdf,.doc,.docx" /></div>
          <div class="f"><label for="j-li">LinkedIn Profile</label><input id="j-li" name="job_application[linkedin]" type="url" /></div>
          <div class="f"><label for="j-gh">GitHub or portfolio</label><input id="j-gh" name="job_application[website]" type="url" /></div>
        </section>

        <section class="card">
          <h2>Education</h2>
          <div class="f"><label for="j-school">School *</label><input id="j-school" name="education[school]" /></div>
          <div class="row2">
            <div class="f">
              <label for="j-degree">Degree</label>
              <select id="j-degree" name="education[degree]">
                <option value="">--</option>
                <option value="hs">High School</option>
                <option value="ba">Bachelor's Degree</option>
                <option value="ma">Master's Degree</option>
                <option value="phd">Doctorate</option>
              </select>
            </div>
            <div class="f"><label for="j-discipline">Discipline</label><input id="j-discipline" name="education[discipline]" /></div>
          </div>
          <div class="f"><label for="j-grad">Graduation date</label><input id="j-grad" name="education[end]" type="month" /></div>
        </section>

        <section class="card">
          <h2>Questions</h2>
          <fieldset>
            <legend>Are you legally authorized to work in Canada? *</legend>
            <div class="inline">
              <label><input type="radio" name="q_auth" value="Yes" required /> Yes</label>
              <label><input type="radio" name="q_auth" value="No" /> No</label>
            </div>
          </fieldset>
          <fieldset>
            <legend>Will you now or in the future require sponsorship? *</legend>
            <div class="inline">
              <label><input type="radio" name="q_sponsor" value="Yes" /> Yes</label>
              <label><input type="radio" name="q_sponsor" value="No" /> No</label>
            </div>
          </fieldset>
          <div class="f">
            <label for="j-hear">How did you hear about us?</label>
            <select id="j-hear" name="q_source">
              <option value="">Select...</option>
              <option>LinkedIn</option>
              <option>Company website</option>
              <option>Referral</option>
              <option>University career fair</option>
              <option>Other</option>
            </select>
          </div>
          <div class="f">
            <label for="j-why">Why do you want to work here? *</label>
            <textarea id="j-why" name="q_why" maxlength="1000" required></textarea>
          </div>
          <div class="f">
            <label for="j-proj">Tell us about a project you're proud of.</label>
            <textarea id="j-proj" name="q_project" maxlength="1500"></textarea>
          </div>
          <div class="f">
            <label for="j-salary">Expected salary (CAD)</label>
            <input id="j-salary" name="q_salary" type="number" min="0" step="1000" />
          </div>
        </section>

        <section class="card">
          <h2>Voluntary self-identification</h2>
          <div class="f">
            <label for="j-gender">Gender</label>
            <select id="j-gender" name="eeo_gender">
              <option value="">Please select</option>
              <option>Woman</option><option>Man</option><option>Non-binary</option><option>I don't wish to answer</option>
            </select>
          </div>
        </section>

        <div class="f"><label><input type="checkbox" name="consent" required /> I agree to the privacy notice *</label></div>
        <button class="submit" type="submit">Submit application</button>
      </form>
    </main>
    <script src="playground.js"></script>
  </body>
</html>
