<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Choices · lazyBoi playground</title>
    <link rel="stylesheet" href="playground.css" />
  </head>
  <body>
    <main>
      <h1>Choices</h1>
      <p class="lead">Selects, radios, checkboxes and suggestion lists.</p>
      <form id="choices">
        <div class="f">
          <label for="country">Country</label>
          <select id="country" name="country">
            <option value="">Select a country…</option>
            <option value="CA">Canada</option>
            <option value="US">United States</option>
            <option value="ET">Ethiopia</option>
            <option value="GB">United Kingdom</option>
            <option value="DE">Germany</option>
          </select>
        </div>
        <div class="f">
          <label for="langs">Languages you speak</label>
          <select id="langs" name="languages" multiple size="5">
            <option value="en">English</option>
            <option value="fr">French</option>
            <option value="am">Amharic</option>
            <option value="es">Spanish</option>
            <option value="zh">Mandarin</option>
          </select>
        </div>
        <fieldset>
          <legend>Preferred work arrangement</legend>
          <div class="inline">
            <label><input type="radio" name="arrangement" value="remote" /> Remote</label>
            <label><input type="radio" name="arrangement" value="hybrid" /> Hybrid</label>
            <label><input type="radio" name="arrangement" value="onsite" /> On-site</label>
          </div>
        </fieldset>
        <div class="f">
          <span class="q" id="seniority-q">Seniority level</span>
          <div class="inline pill-radio" role="radiogroup" aria-labelledby="seniority-q">
            <input type="radio" id="s1" name="seniority" value="intern" /><label for="s1">Intern</label>
            <input type="radio" id="s2" name="seniority" value="junior" /><label for="s2">Junior</label>
            <input type="radio" id="s3" name="seniority" value="mid" /><label for="s3">Mid-level</label>
            <input type="radio" id="s4" name="seniority" value="senior" /><label for="s4">Senior</label>
          </div>
        </div>
        <fieldset>
          <legend>Skills</legend>
          <div class="inline">
            <label><input type="checkbox" name="skills" value="ts" /> TypeScript</label>
            <label><input type="checkbox" name="skills" value="py" /> Python</label>
            <label><input type="checkbox" name="skills" value="react" /> React</label>
            <label><input type="checkbox" name="skills" value="sql" /> SQL</label>
            <label><input type="checkbox" name="skills" value="ml" /> Machine learning</label>
          </div>
        </fieldset>
        <div class="f">
          <label for="framework">Favourite framework</label>
          <input id="framework" name="framework" list="fw-list" type="text" />
          <datalist id="fw-list">
            <option value="React"></option>
            <option value="Vue"></option>
            <option value="Svelte"></option>
            <option value="Angular"></option>
          </datalist>
        </div>
        <div class="f">
          <label><input type="checkbox" name="newsletter" /> Send me the monthly newsletter</label>
        </div>
        <div class="f">
          <label><input type="checkbox" name="relocate" value="yes" /> I'm willing to relocate</label>
        </div>
        <button class="submit" type="submit">Save</button>
      </form>
    </main>
    <script src="playground.js"></script>
  </body>
</html>
