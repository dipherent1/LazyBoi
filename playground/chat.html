<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mock AI chat · lazyBoi playground</title>
    <link rel="stylesheet" href="playground.css" />
    <style>
      .chat { display: flex; flex-direction: column; height: 70vh; border: 1px solid #e3e3ea; border-radius: 12px; overflow: hidden; }
      #log { flex: 1; overflow: auto; padding: 14px; background: #fafafc; }
      .msg { max-width: 85%; margin: 0 0 12px; padding: 10px 12px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; font-size: 14px; }
      .msg.user { margin-left: auto; background: #e8f0ff; }
      .msg.ai { background: #fff; border: 1px solid #e3e3ea; }
      .msg pre { background: #1d1b26; color: #eee; padding: 10px; border-radius: 8px; overflow: auto; font-size: 12px; margin: 8px 0; white-space: pre-wrap; }
      .composer { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #e3e3ea; background: #fff; align-items: flex-end; }
      #box { flex: 1; min-height: 44px; max-height: 160px; overflow: auto; border: 1px solid #c8c8d2; border-radius: 10px; padding: 10px; outline: none; }
      #box:empty::before { content: attr(data-placeholder); color: #999; }
    </style>
  </head>
  <body>
    <main>
      <h1>Mock AI chat</h1>
      <p class="lead">
        A fake chat with a rich message box. When you send a lazyBoi form-fill request, the "AI" replies with sample
        values (never real facts about you), so the whole loop can be tested without a real chat.
      </p>
      <div class="chat">
        <div id="log"><div class="msg ai">Hi! Paste a lazyBoi form request and press Send.</div></div>
        <div class="composer">
          <div id="box" contenteditable="true" role="textbox" aria-label="Message the AI" data-placeholder="Message Mock AI…"></div>
          <button class="submit" id="send" type="button">Send</button>
        </div>
      </div>
    </main>
    <script>
      const log = document.getElementById("log");
      const box = document.getElementById("box");
      const add = (cls, node) => { const d = document.createElement("div"); d.className = "msg " + cls; d.append(node); log.append(d); log.scrollTop = log.scrollHeight; return d; };

      function sample(f) {
        const opt = (o) => (typeof o === "string" ? o : o.value);
        switch (f.type) {
          case "email": return "test.user@example.com";
          case "tel": return "+1 555 010 4242";
          case "url": return "https://example.com/test";
          case "number": return f.min ? Number(f.min) + 1 : 3;
          case "date": return f.format === "YYYY-MM" ? "2026-05" : f.format === "HH:MM" ? "09:30" : "2026-05-01";
          case "select": case "radio": return opt(f.options[0]);
          case "multiselect": case "checkbox-group": return f.options.slice(0, 2).map(opt);
          case "checkbox": return true;
          default: {
            const s = `Sample ${f.label}`;
            return f.maxLength ? s.slice(0, f.maxLength) : s + " (test data, not real).";
          }
        }
      }

      function mockAI(text) {
        const session = (text.match(/Session: (lb-[0-9a-f]+)/) || [])[1];
        const arr = text.match(/Fields \(JSON\):\s*(\[[\s\S]*\])\s*$/);
        if (!session || !arr) return { text: "I only understand lazyBoi form requests in this demo." };
        const fields = JSON.parse(arr[1].replace(/\n\s*/g, ""));
        const values = {};
        fields.forEach((f, i) => { if (i % 7 !== 6) values[f.id] = sample(f); }); // leave every 7th field out
        const skipped = fields.filter((f) => !(f.id in values)).map((f) => f.label);
        return { json: JSON.stringify({ session, values }), skipped };
      }

      function send() {
        const text = box.innerText.trim();
        if (!text) return;
        add("user", document.createTextNode(text));
        box.textContent = "";
        setTimeout(() => {
          const r = mockAI(text);
          const wrap = document.createElement("div");
          if (!r.json) { wrap.textContent = r.text; return add("ai", wrap); }
          wrap.append("Here you go (sample values):");
          const pre = document.createElement("pre");
          const code = document.createElement("code");
          code.className = "language-lazyboi";
          code.textContent = r.json;
          pre.append(code);
          wrap.append(pre);
          wrap.append(r.skipped.length ? "I left out: " + r.skipped.join(", ") + ". Tell me about those." : "All fields filled.");
          add("ai", wrap);
        }, 500);
      }
      document.getElementById("send").addEventListener("click", send);
      box.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
    </script>
    <script src="playground.js"></script>
  </body>
</html>
